<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #004628; letter-spacing: 0.8px; text-anchor: middle; }
      .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; font-weight: 500; fill: #666666; text-anchor: middle; }
      .badge-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
      .mono-text { font-family: 'SF Mono', 'Roboto Mono', Menlo, monospace; font-size: 9.5px; fill: #666666; text-anchor: middle; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background surface -->
  <rect width="1000" height="260" rx="16" fill="#FFFFFF" stroke="#E6E6E6" stroke-width="1"/>

  <!-- Column Dividers -->
  <line x1="200" y1="16" x2="200" y2="244" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="16" x2="400" y2="244" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="600" y1="16" x2="600" y2="244" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="800" y1="16" x2="800" y2="244" stroke="#F0F0F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- 1. STATE IDLE -->
  <g id="state-idle">
    <text x="100" y="36" class="title">IDLE</text>
    <text x="100" y="52" class="subtitle">Standby dock</text>
    
    <!-- Dock Circle -->
    <circle cx="100" cy="136" r="34" fill="#EBF7EC" stroke="#00AA46" stroke-width="1.5"/>
    <!-- S-Ribbon Path -->
    <g transform="translate(100, 136) scale(2.2) translate(-11.87, -12)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M8.17152 9.75C8.17152 5.46979 11.6413 2 15.9215 2H18.0005V3.5H15.9215C12.4697 3.5 9.67152 6.29822 9.67152 9.75V13.9079C9.67152 15.1505 8.66416 16.1579 7.42152 16.1579H7.2373V17.5789H7.84257C9.63749 17.5789 11.0926 16.1239 11.0926 14.3289V9.67105C11.0926 7.0477 13.2192 4.92105 15.8426 4.92105H18.0005V9.3421H16.2636C15.8494 9.3421 15.5136 9.67789 15.5136 10.0921V14.25C15.5136 18.5302 12.0438 22 7.76362 22H5.75046V20.5H7.76362C11.2154 20.5 14.0136 17.7018 14.0136 14.25V10.0921C14.0136 8.84946 15.021 7.8421 16.2636 7.8421H16.5005V6.42105H15.8426C14.0476 6.42105 12.5926 7.87613 12.5926 9.67105V14.3289C12.5926 16.9523 10.4659 19.0789 7.84257 19.0789H5.7373V14.6579H7.42152C7.83573 14.6579 8.17152 14.3221 8.17152 13.9079V9.75Z" fill="#004628"/>
    </g>

    <!-- State Tag -->
    <rect x="54" y="214" width="92" height="20" rx="10" fill="#F5F5F5"/>
    <text x="100" y="228" class="mono-text">scale: 1.0 • 0 dB</text>
  </g>

  <!-- 2. STATE LISTENING -->
  <g id="state-listening">
    <text x="300" y="36" class="title">LISTENING</text>
    <text x="300" y="52" class="subtitle">Expanded mint halo</text>

    <!-- Outer Mint Halos -->
    <circle cx="300" cy="136" r="52" fill="none" stroke="#91FA9B" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="6 4"/>
    <circle cx="300" cy="136" r="43" fill="none" stroke="#00EB5A" stroke-width="2.5" stroke-opacity="0.75"/>

    <!-- Dock Circle Active -->
    <circle cx="300" cy="136" r="34" fill="#91FA9B" stroke="#00AA46" stroke-width="2"/>

    <!-- Widened S-Ribbon Path with Green Glow -->
    <g transform="translate(300, 136) scale(2.35) translate(-11.87, -12)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M8.17152 9.75C8.17152 5.46979 11.6413 2 15.9215 2H18.0005V3.5H15.9215C12.4697 3.5 9.67152 6.29822 9.67152 9.75V13.9079C9.67152 15.1505 8.66416 16.1579 7.42152 16.1579H7.2373V17.5789H7.84257C9.63749 17.5789 11.0926 16.1239 11.0926 14.3289V9.67105C11.0926 7.0477 13.2192 4.92105 15.8426 4.92105H18.0005V9.3421H16.2636C15.8494 9.3421 15.5136 9.67789 15.5136 10.0921V14.25C15.5136 18.5302 12.0438 22 7.76362 22H5.75046V20.5H7.76362C11.2154 20.5 14.0136 17.7018 14.0136 14.25V10.0921C14.0136 8.84946 15.021 7.8421 16.2636 7.8421H16.5005V6.42105H15.8426C14.0476 6.42105 12.5926 7.87613 12.5926 9.67105V14.3289C12.5926 16.9523 10.4659 19.0789 7.84257 19.0789H5.7373V14.6579H7.42152C7.83573 14.6579 8.17152 14.3221 8.17152 13.9079V9.75Z" fill="#004628"/>
    </g>

    <!-- Active Mic Indicator Dot -->
    <circle cx="300" cy="96" r="3.5" fill="#00EB5A" stroke="#004628" stroke-width="1"/>

    <!-- State Tag -->
    <rect x="246" y="214" width="108" height="20" rx="10" fill="#EBF7EC" stroke="#99D59F" stroke-width="1"/>
    <text x="300" y="228" class="badge-text" fill="#007841">Halo • Mic Active</text>
  </g>

  <!-- 3. STATE THINKING -->
  <g id="state-thinking">
    <text x="500" y="36" class="title">THINKING</text>
    <text x="500" y="52" class="subtitle">Staggered dash phase</text>

    <!-- Orbital Phase Track -->
    <circle cx="500" cy="136" r="44" fill="none" stroke="#D2FCD5" stroke-width="2" stroke-dasharray="4 8"/>
    <!-- Orbiting Pulse Beads -->
    <circle cx="538" cy="114" r="4" fill="#00EB5A" filter="url(#glow)"/>
    <circle cx="466" cy="154" r="3.5" fill="#00AA46"/>
    <circle cx="510" cy="178" r="2.5" fill="#91FA9B"/>

    <!-- Dock Circle -->
    <circle cx="500" cy="136" r="34" fill="#EBF7EC" stroke="#007841" stroke-width="2"/>

    <!-- Staggered Phase S-Ribbon -->
    <g transform="translate(500, 136) scale(2.2) translate(-11.87, -12)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M8.17152 9.75C8.17152 5.46979 11.6413 2 15.9215 2H18.0005V3.5H15.9215C12.4697 3.5 9.67152 6.29822 9.67152 9.75V13.9079C9.67152 15.1505 8.66416 16.1579 7.42152 16.1579H7.2373V17.5789H7.84257C9.63749 17.5789 11.0926 16.1239 11.0926 14.3289V9.67105C11.0926 7.0477 13.2192 4.92105 15.8426 4.92105H18.0005V9.3421H16.2636C15.8494 9.3421 15.5136 9.67789 15.5136 10.0921V14.25C15.5136 18.5302 12.0438 22 7.76362 22H5.75046V20.5H7.76362C11.2154 20.5 14.0136 17.7018 14.0136 14.25V10.0921C14.0136 8.84946 15.021 7.8421 16.2636 7.8421H16.5005V6.42105H15.8426C14.0476 6.42105 12.5926 7.87613 12.5926 9.67105V14.3289C12.5926 16.9523 10.4659 19.0789 7.84257 19.0789H5.7373V14.6579H7.42152C7.83573 14.6579 8.17152 14.3221 8.17152 13.9079V9.75Z" fill="#004628" opacity="0.85"/>
      <!-- Pulse overlay along ribbon curve -->
      <path d="M15.9 3.5C12.5 3.5 9.7 6.3 9.7 9.8V13.9" stroke="#00EB5A" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-dasharray="3 5"/>
    </g>

    <!-- State Tag -->
    <rect x="448" y="214" width="104" height="20" rx="10" fill="#EBF7EC" stroke="#99D59F" stroke-width="1"/>
    <text x="500" y="228" class="badge-text" fill="#007841">Phase • Orbit 400ms</text>
  </g>

  <!-- 4. STATE SPEAKING -->
  <g id="state-speaking">
    <text x="700" y="36" class="title">SPEAKING</text>
    <text x="700" y="52" class="subtitle">S-wave crests &amp; echo</text>

    <!-- Concentric Sound Echo Waves -->
    <circle cx="700" cy="136" r="62" fill="none" stroke="#91FA9B" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6 6"/>
    <circle cx="700" cy="136" r="52" fill="none" stroke="#00EB5A" stroke-width="1.8" stroke-opacity="0.6"/>
    <circle cx="700" cy="136" r="42" fill="none" stroke="#00AA46" stroke-width="2.2" stroke-opacity="0.85"/>

    <!-- Dock Circle Active -->
    <circle cx="700" cy="136" r="34" fill="#91FA9B" stroke="#004628" stroke-width="2.2"/>

    <!-- Speaking S-Ribbon Wave -->
    <g transform="translate(700, 136) scale(2.2) translate(-11.87, -12)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M8.17152 9.75C8.17152 5.46979 11.6413 2 15.9215 2H18.0005V3.5H15.9215C12.4697 3.5 9.67152 6.29822 9.67152 9.75V13.9079C9.67152 15.1505 8.66416 16.1579 7.42152 16.1579H7.2373V17.5789H7.84257C9.63749 17.5789 11.0926 16.1239 11.0926 14.3289V9.67105C11.0926 7.0477 13.2192 4.92105 15.8426 4.92105H18.0005V9.3421H16.2636C15.8494 9.3421 15.5136 9.67789 15.5136 10.0921V14.25C15.5136 18.5302 12.0438 22 7.76362 22H5.75046V20.5H7.76362C11.2154 20.5 14.0136 17.7018 14.0136 14.25V10.0921C14.0136 8.84946 15.021 7.8421 16.2636 7.8421H16.5005V6.42105H15.8426C14.0476 6.42105 12.5926 7.87613 12.5926 9.67105V14.3289C12.5926 16.9523 10.4659 19.0789 7.84257 19.0789H5.7373V14.6579H7.42152C7.83573 14.6579 8.17152 14.3221 8.17152 13.9079V9.75Z" fill="#004628"/>
    </g>

    <!-- Outward Wave Crests (Left and Right) -->
    <path d="M646 126 C640 131 640 141 646 146" stroke="#004628" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M638 120 C630 128 630 144 638 152" stroke="#007841" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M754 126 C760 131 760 141 754 146" stroke="#004628" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M762 120 C770 128 770 144 762 152" stroke="#007841" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- State Tag -->
    <rect x="644" y="214" width="112" height="20" rx="10" fill="#004628"/>
    <text x="700" y="228" class="badge-text" fill="#91FA9B">Speaking • Wave Echo</text>
  </g>

  <!-- 5. STATE REDUCED MOTION -->
  <g id="state-reduced-motion">
    <text x="900" y="36" class="title">REDUCED MOTION</text>
    <text x="900" y="52" class="subtitle">Static contrast badge</text>

    <!-- Static High-Contrast Ring -->
    <circle cx="900" cy="136" r="38" fill="none" stroke="#00AA46" stroke-width="3"/>
    <circle cx="900" cy="136" r="34" fill="#FFFFFF" stroke="#004628" stroke-width="1.5"/>

    <!-- Standard S-Ribbon -->
    <g transform="translate(900, 136) scale(2.2) translate(-11.87, -12)">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M8.17152 9.75C8.17152 5.46979 11.6413 2 15.9215 2H18.0005V3.5H15.9215C12.4697 3.5 9.67152 6.29822 9.67152 9.75V13.9079C9.67152 15.1505 8.66416 16.1579 7.42152 16.1579H7.2373V17.5789H7.84257C9.63749 17.5789 11.0926 16.1239 11.0926 14.3289V9.67105C11.0926 7.0477 13.2192 4.92105 15.8426 4.92105H18.0005V9.3421H16.2636C15.8494 9.3421 15.5136 9.67789 15.5136 10.0921V14.25C15.5136 18.5302 12.0438 22 7.76362 22H5.75046V20.5H7.76362C11.2154 20.5 14.0136 17.7018 14.0136 14.25V10.0921C14.0136 8.84946 15.021 7.8421 16.2636 7.8421H16.5005V6.42105H15.8426C14.0476 6.42105 12.5926 7.87613 12.5926 9.67105V14.3289C12.5926 16.9523 10.4659 19.0789 7.84257 19.0789H5.7373V14.6579H7.42152C7.83573 14.6579 8.17152 14.3221 8.17152 13.9079V9.75Z" fill="#004628"/>
    </g>

    <!-- Static Status Badge Pill -->
    <rect x="845" y="188" width="110" height="22" rx="11" fill="#004628" stroke="#00AA46" stroke-width="1.5"/>
    <circle cx="858" cy="199" r="4" fill="#00EB5A"/>
    <text x="905" y="202" font-family="'Inter', -apple-system, sans-serif" font-size="9px" font-weight="700" fill="#FFFFFF" letter-spacing="0.6px" text-anchor="middle">LISTENING</text>

    <!-- State Tag -->
    <rect x="834" y="220" width="132" height="18" rx="9" fill="#F5F5F5"/>
    <text x="900" y="232" class="mono-text">prefers-reduced-motion</text>
  </g>
</svg>
