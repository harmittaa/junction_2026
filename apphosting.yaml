runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 1
  concurrency: 20

env:
  - variable: GOOGLE_CLOUD_PROJECT
    value: sponky-junction-2026
    availability: [RUNTIME]
  # Explicit versions avoid granting the runtime account secret metadata access.
  # Rotation requires updating these pins and deploying again.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY@2
    availability: [RUNTIME]
  - variable: ELEVENLABS_API_KEY
    secret: ELEVENLABS_API_KEY@1
    availability: [RUNTIME]
  - variable: SESSION_SECRET
    secret: SESSION_SECRET@1
    availability: [RUNTIME]
  - variable: GEMINI_MODEL
    value: gemini-4-hydrogen
    availability: [RUNTIME]
  - variable: ELEVENLABS_STT_MODEL
    value: scribe_v3_live
    availability: [RUNTIME]
  - variable: ELEVENLABS_TTS_MODEL
    value: eleven_flash_v2_5
    availability: [RUNTIME]
  - variable: ELEVENLABS_VOICE_ID
    value: cgSgspJ2msm6clMCkdW9
    availability: [RUNTIME]
