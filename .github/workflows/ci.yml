name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and media dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Typecheck, lint, unit and importer tests
        run: npm run check
      - name: Firestore integration tests
        run: npm run test:emulator
      - name: Build production app
        run: npm run build
      # Playwright owns a fresh emulator, fake Gemini server and next start.
      - name: Production browser smoke tests
        run: npm run test:e2e
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics
          path: |
            test-results/
            playwright-report/
            *debug*.log
          if-no-files-found: ignore
          retention-days: 3
