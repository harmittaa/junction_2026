name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**/*.md"
      - "docs/**/*.html"
      - ".agents/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**/*.md"
      - "docs/**/*.html"
      - ".agents/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        if: github.event_name != 'push'
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        if: github.event_name != 'push'
        run: npx playwright install --with-deps chromium
      - name: Typecheck, lint, unit and importer tests
        run: npm run check
      - name: Firestore integration tests
        if: github.event_name != 'push'
        run: npm run test:emulator
      - name: Build production app
        if: github.event_name != 'push'
        run: npm run build
      # Playwright owns a fresh emulator, fake Gemini server and next start.
      - name: Production browser smoke tests
        if: github.event_name != 'push'
        run: npm run test:e2e
      - name: Retain failure diagnostics
        if: failure() && github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: failure-diagnostics
          path: |
            test-results/
            playwright-report/
            *debug*.log
          if-no-files-found: ignore
          retention-days: 3
